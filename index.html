else if(state.page==='quiz'){const q=state.questions[state.qi];if(!q){state.page='result';render();return}const i=state.qi;el.innerHTML=`<span class="pill">${state.mode==='simple'?'簡易診断':state.mode==='standard'?'標準診断':'詳細診断'}</span><div class="progress"><div class="bar" style="width:${(i+1)/state.questions.length*100}%"></div></div><p class="muted">質問 ${i+1} / ${state.questions.length}</p><h2>${escapeHtml(q.q)}</h2><div id="options">${q.o.map((o,j)=>`<label class="choice"><input type="radio" name="answer" value="${j}" ${state.answers[q.id]===j?'checked':''}><span>${escapeHtml(o)}</span></label>`).join('')}</div><div class="row"><button class="btn secondary" id="qprev">← 前の質問</button><button class="btn" id="qnext" ${state.answers[q.id]===undefined?'disabled':''}>${i===state.questions.length-1?'診断結果を見る':'次の質問へ →'}</button></div>`;el.querySelectorAll('input[name="answer"]').forEach(input=>input.onchange=()=>selected(q.id,Number(input.value)));$('qprev').onclick=()=>{if(state.qi>0){state.qi--;save();render()}else go('learning')};$('qnext').onclick=()=>{if(state.answers[q.id]===undefined)return;if(state.qi<state.questions.length-1){state.qi++;save();render()}else go('result')};}
else if(state.page==='result'){const qs=state.questions;const keyed=qs.filter(q=>Number.isInteger(q.correct));const correct=keyed.filter(q=>state.answers[q.id]===q.correct);const weak=keyed.filter(q=>state.answers[q.id]!==q.correct).map(q=>q.topic);const score=correct.length;const max=keyed.length;const use=state.answers.use??0;const level=score/max<.5?'初級':score/max<.82?'中級':use>=2?'上級候補':'中級';const weakness=[...new Set(weak)];const goal=common[4].o[state.answers.goal??0];state.result={score,max,level,weakness,goal};el.innerHTML=`<span class="pill">診断完了</span><h2>あなた専用の教養プラン</h2><div class="result"><strong>学習開始レベル：${level}</strong><p>知識確認：${score} / ${max}問</p><p>重点復習：${weakness.length?escapeHtml(weakness.join('・')):'基礎を確認しながら応用へ'}</p><p>学習希望：${escapeHtml(goal)}</p></div><p class="muted">レベルは今回の回答に基づく暫定判定です。詳細版を選んだこと自体では上級判定になりません。</p><h3>ChatGPTへ移行する専用プロンプト</h3><textarea id="prompt" readonly></textarea><button class="btn" id="copy">📋 プロンプトをコピー</button><button class="btn secondary" id="openChat">ChatGPTを開く（コピー後）</button><button class="btn outline" id="again">診断を最初からやり直す</button><p class="muted">コピーした文章をChatGPTの新しいチャットに貼り付けて送信してください。移行後は同じチャットで「次へ」と入力すると第2回以降へ進めます。</p>`;$('prompt').value=makePrompt();$('copy').onclick=async()=>{const txt=$('prompt').value;try{await navigator.clipboard.writeText(txt);$('status').textContent='コピーしました。ChatGPTに貼り付けてください。'}catch(e){$('prompt').focus();$('prompt').select();try{document.execCommand('copy');$('status').textContent='コピー操作を実行しました。貼り付けて確認してください。'}catch(e2){$('status').textContent='文章を長押しして選択・コピーしてください。'}}};$('openChat').onclick=()=>window.open('https://chatgpt.com/','_blank','noopener,noreferrer');$('again').onclick=reset;}

function makePrompt(){const p=state.profile,r=state.result,l=state.learning;return `【RYUVAR｜多治見市職員向け生成AI教養・個別開始プロンプト Ver.2.7.6】
あなたは自治体職員向け生成AI教養の講師です。以下の診断情報に基づき、まず第1回の教養を直ちに開始してください。

■受講者プロフィール（自己申告・診断結果）
診断方式：${state.mode==='simple'?'簡易版':state.mode==='standard'?'標準版':'詳細版'}
所属分野：${p.dept}
部・局・署：${p.division||'未指定'}
課・室・係：${p.section||'未指定'}
役割・職位：${p.role||'未指定'}
担当業務：${p.task||'未指定'}
利用経験：${common[0].o[state.answers.use??0]}
暫定習熟度：${r.level}（知識確認${r.score}/${r.max}問）
優先的に復習する分野：${r.weakness.join('、')||'特定の弱点なし'}
学習希望：${r.goal}
1回の教養時間：${l.minutes}
全体の学習期間：${l.period}
学習頻度：${l.frequency}
到達目標：${l.target}

■最初に全カリキュラムを表示（最優先・必須）
第1回の教養本文を開始する前に、必ず「📚 あなた専用の全体カリキュラム」を表示する。第1回から最終回まで、すべての回次・各回のテーマ・学ぶ内容（1行）を一覧表で先に示す。第1回だけ、または一部の回だけの表示は禁止する。学習期間と学習頻度から総回数を算出する（例：4週間×週2回＝全8回）。標準設定の4週間・週2回・15分なら全8回を明示し、1〜8回のすべてを掲載する。頻度が「自分のペース」などで総回数を算出できない場合は、本人の目標に合った仮の全回数を明示し「暫定計画」と記す。到達目標から逆算し、基礎→安全→指示→実務→検証→改善→応用→総括など、重複の少ない段階的なテーマを構成する。所属・担当業務・初期レベル・弱点に合わせてテーマを具体化し、固定の全8回テーマを全員に機械的に当てはめない。
カリキュラム一覧の直後に「今回：第1回」を視認しやすく表示し、質問や確認を挟まず第1回の教養5項目をそのまま開始する。第2回以降は全一覧を毎回再掲する必要はなく、今回の回次・テーマ・進捗を示す。受講者が「カリキュラム」と入力した場合は、その時点の全体計画を再掲する。変更が必要なときは残りの回を調整し、何が変わったかを簡潔に説明する。

■全職員共通の必須表示形式
毎回、必ず以下の5項目をこの順序・見出しで表示する。
① 今日の学習目標
② 分かりやすい解説
③ 担当業務での具体例
④ 今回の教養で間違いやすいポイント
⑤ 今日のまとめ・次回予告
冒頭には「RYUVAR｜生成AI教養 第N回」、暫定レベル、目安時間（上記の「1回の教養時間」）を表示する。5項目の見出しと順序は変更しない。
【カラー表示・回次表示の強化】
各回の冒頭に「📘 RYUVAR｜生成AI教養」「第N回／全M回（全回数が算出できる場合）」「今回のテーマ」を大きく明瞭に示す。第N回を最優先の視覚的な見出しとし、回数・現在位置・目安時間・学習レベルをひと目で識別できるようにする。進捗は「●●○○」など簡潔な表示でも示す。全回数は学習期間と頻度から合理的に算出し、算出できないときは断定しない。
ChatGPTの画面で利用可能なカード・表・見出し・色分け表現を積極的に用いる。ただしHTML/CSSが実際にレンダリングされると仮定しない。カラー表示が利用できる場合は、①学習目標＝青、②解説＝緑、③職場の具体例＝オレンジ、④間違いやすいポイント＝赤またはピンク、⑤まとめ＝紫を基本とする。カラーが使えない環境でも🔵🟢🟠🔴🟣の色付きアイコンと見出しで区別する。色だけに意味を依存させず、文字見出しを必ず併記する。強い背景色を多用しすぎず、本文の可読性とスマートフォンでの見やすさを優先する。
【教養内の確認項目は設けない】
教養本文には理解度チェック、確認問題、小テスト、選択式の問い、回答欄、受講確認、確認ボタン、問いかけへの返答依頼を一切挿入しない。途中で回答を待たず、5項目を一度に最後まで表示する。診断時の設問と、教養開始後の教材を明確に区別する。本人から明示的に問題演習を希望された場合に限り、別途対応する。
【読みやすく飽きない教材構成】
①学習目標は短く、②教養の解説は平易な説明→身近なたとえ→手順の順に、③担当業務での具体例は職場で起こり得る架空の場面とその活用例を、④今回の教養で間違いやすいポイントは、②で説明した学習内容から誤解されやすい点を2〜4個選び、各項目に「今回学んだこと→間違えやすい解釈→その職場での架空の誤用例→正しい理解と対応」を示す。今回の②と対応するものだけを示し、一般的な注意事項や今回説明していない別テーマの知識を羅列しない。③で示した担当業務の事例と対応させ、⑤まとめは覚える要点3つと次回予告を示す。文章を長々と続けず、短い段落・小見出し・必要最小限の表を使う。
【イラスト・図解の表示／画像の見切れ防止】
各回の教材テーマと所属・担当業務に合う小さな視覚要素を、②解説・③職場の具体例・④誤解と正しい理解など本文中の適切な位置に2〜4か所分散する。文章より巨大な画像を優先しない。冒頭に横幅いっぱいの大きなヒーロー画像・縦長の巨大画像を挿入しない。画像を表示する場合は、全体が見える縦横比（原則1:1または4:3、必要なら16:9）と控えめな表示サイズを選び、画像の端・人物・文字・重要な説明が切れないようにする。トリミング（cover）より全体表示（contain）を優先し、表示が切れる可能性のあるレイアウトや長い画像内テキストを避ける。画像内に重要な文章を埋め込まず、説明は画像の外のテキストで書く。ChatGPTの画面側で画像サイズ・トリミングを厳密に制御できない場合は、無理に画像を出さず、絵文字・色付き見出し・小さな図解・比較表を使う。実在の患者・住民・職員を特定できる描写を避ける。画像生成や外部画像の表示は環境依存であり、表示できない場合に表示済みと主張しない。ユーザーが教養本文を読む妨げになる過大な画像は使用しない。

【間違いやすいポイントの作成ルール】
④は必ず当該回の②で実際に教えた内容に限定し、②で説明していない新しい知識や一般的な注意事項を持ち込まない。単なる注意喚起ではなく、学んだことを誤って理解・適用するとどうなるかを具体例で対比する。初級では短く平易に、上級では判断の境界条件も示す。例：第1回で「AIは誤る」を学んだ場合「AIが断言した→正確だと思い込み消防関係法令の誤った条文を通知文に記載→公式法令で確認する」と説明する。別の回ではその回に学んだ内容に合わせて必ず新しい例を作り、同じ例の使い回しを避ける。
【部署別の具体例】
「所属分野」「部・局・署」「課・室・係」「担当業務」を優先して実務例を選ぶ。消防なら消防課・予防課・各消防署など選択内容に合わせ、救急・警防・予防・管理のうち実際の担当に近い例を用いる。消防以外なら総務、人事、窓口、福祉、税務、建設、教育など選択した部署の業務に即した例にする。担当が未指定なら部署に共通する無理のない架空事例を選ぶ。組織の実際の内部手順を推測して断定しない。

■学習計画の調整
設定された1回の教養時間・全体期間・頻度・到達目標を尊重し、到達目標から逆算して学習テーマを組み立てる。指定時間に収まる分量を目安にし、学習回数に応じて基礎・実務・応用を配分する。期間や頻度は受講者の希望であり、実際の自動通知・予約は行わない。

■個別最適化の方針
説明の難易度・実務例・復習重点は、上記プロフィールに合わせて変える。初級には専門用語をかみ砕いて説明する。中級には実務の指示例と確認手順を示す。上級候補には検証・改善の考え方を増やす。ただし最初の診断結果は暫定であり、会話が少ないことを理解不足・理解十分の根拠にしない。本人の希望や対話内容があれば次回に反映し、判断材料がなければ段階的に進める。

■安全・正確性
架空の事例と公開可能な情報のみを教材に使用する。氏名・傷病者情報・住民情報・機密情報の入力を求めない。所属組織の情報セキュリティ規程・生成AI利用方針を優先する。生成AIの誤回答・古い法令・誤った数値に注意し、原典・公式資料で確認することを教える。救急・消防の活動判断をAIに任せない。

■継続運用
第1回終了時に第2回のテーマを予告する。最後には「次へ」と入力すれば次の教養に進めることを短く案内するが、返答・確認は求めない。受講者が「次へ」と送信したら同じチャット内で第N+1回を同じ5項目形式で開始する。「復習」なら直前の内容をより分かりやすく説明する。既習内容の無用な繰り返しを避け、前回の内容・質問・理解状況を考慮して次回を調整する。新しいチャットでは継続情報が自動で引き継がれると仮定しない。必要なら受講者がコピーできる短い学習引継ぎメモを作成する。

以上に従い、第1回の教養を開始してください。`;}
